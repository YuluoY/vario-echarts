name: Deploy Studio to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 同一时间只允许一个部署，取消排队中的旧任务
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4 # 版本读取根 package.json 的 packageManager 字段

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm -r --filter '!@vario-echarts/studio' build

      - name: Build Studio (with Pages base path)
        env:
          # 以仓库名作为子路径，如 /vario-echarts/
          VITE_BASE: /${{ github.event.repository.name }}/
          # monaco + echarts 打包内存消耗大，默认堆会 OOM
          NODE_OPTIONS: --max-old-space-size=6144
        run: pnpm --filter @vario-echarts/studio build

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/studio/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
